services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Pinned so the node identity (rabbit@<hostname>) stays stable across
    # recreates — without this, RabbitMQ orphans /mnt/rabbitmq-data under a
    # new random node name on every recreate and boots as if brand new.
    hostname: rabbitmq
    volumes:
      - /mnt/rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    volumes:
      - /mnt/mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: entri
      MYSQL_USER: entri-db-user
      MYSQL_PASSWORD: P@ssw0rd_local42
      MYSQL_ROOT_PASSWORD: Thi!5!5v3ryh@rd35t
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
