services:
  api:
    image: ${API_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_API_URL: ${APP_API_URL}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase.json
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      NOVU_SECRET: ${NOVU_SECRET}
      INTASEND_PUBLISHABLE_KEY: ${INTASEND_PUBLISHABLE_KEY}
      INTASEND_SECRET_KEY: ${INTASEND_SECRET_KEY}
      INTASEND_WEBHOOK_CHALLENGE: ${INTASEND_WEBHOOK_CHALLENGE}
    volumes:
      - /etc/entri/firebase.json:/secrets/firebase.json:ro
    mem_limit: 768m
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    expose:
      - "80"
    healthcheck:
      # 127.0.0.1, not localhost — this image's nginx only listens on IPv4
      # (the entrypoint's IPv6-auto-listen script skips custom configs), and
      # if localhost resolves to ::1 first, wget fails with connection refused
      # even though the app is perfectly healthy on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Pinned so the node identity (rabbit@<hostname>) stays stable across
    # recreates — without this, RabbitMQ orphans /mnt/rabbitmq-data under a
    # new random node name on every recreate and boots as if brand new.
    hostname: rabbitmq
    volumes:
      - /mnt/rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  certbot-webroot:
