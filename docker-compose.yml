services:
  db:
    image: 'mysql:8.0.32'
    environment:
      MYSQL_DATABASE: entri
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - entri-data:/var/lib/mysql
    ports:
      - '127.0.0.1:3306:3306'
    mem_limit: 512m
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/d-kens/entri-api:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/entri?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase.json
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      NOVU_SECRET: ${NOVU_SECRET}
    volumes:
      - /etc/entri/firebase.json:/secrets/firebase.json:ro
    mem_limit: 768m
    expose:
      - '8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/d-kens/entri-web:latest
    expose:
      - '80'
    depends_on:
      - api
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REPO_USER: ${GHCR_USERNAME}
      REPO_PASS: ${GHCR_TOKEN}
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: 'true'
      DOCKER_API_VERSION: '1.41'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  entri-data:
  certbot-webroot: