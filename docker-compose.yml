services:
  db:
    image: 'mysql:8.0.32'
    environment:
      MYSQL_DATABASE: 'puuuul'
      MYSQL_USER: 'puuuul-db-user'
      MYSQL_PASSWORD: 'secret'
      MYSQL_ROOT_PASSWORD: 'secret'
    volumes:
      - puuuul-data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  puuuul-data: