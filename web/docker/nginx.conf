server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compress responses before sending to reduce transfer size
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Instruct browsers to enforce basic security policies
    add_header X-Frame-Options "SAMEORIGIN" always;       # Block clickjacking via iframes
    add_header X-Content-Type-Options "nosniff" always;   # Prevent MIME-type sniffing
    add_header X-XSS-Protection "1; mode=block" always;   # Block reflected XSS in older browsers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; # Limit referrer leakage

    # Angular build hashes asset filenames on every deploy, so 1-year cache is safe
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html has no hash — always fetch fresh so users get the latest deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # For any path not matching a real file, serve index.html and let Angular's router handle it
    location / {
        try_files $uri $uri/ /index.html;
    }
}
