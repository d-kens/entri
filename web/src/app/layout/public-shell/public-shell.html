<div class="min-h-screen bg-[#FFF7F0]">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 bg-[#FFF7F0]/95 backdrop-blur-sm border-b border-[#E0D5CC]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

      <!-- Logo -->
      <a [routerLink]="['/']" (click)="closeMenu()" class="flex items-center gap-1.5 flex-shrink-0">
        <span class="font-display text-2xl font-black tracking-tight text-[#1A1A1A] leading-none select-none">Entri</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#E8572A] flex-shrink-0 mb-0.5"></span>
      </a>

      <!-- Desktop nav + actions -->
      <nav class="hidden md:flex items-center gap-6">
        <a [routerLink]="['/events']" class="nav-link">Events</a>
        <a [routerLink]="['/']" fragment="pricing" class="nav-link">Pricing</a>
        <a [routerLink]="['/']" fragment="faq" class="nav-link">FAQ</a>
        <a [routerLink]="['/auth/login']" class="nav-link">Organizer Sign In</a>
        <a [routerLink]="['/auth/register']">
          <button mat-flat-button class="nav-cta">Organizer Sign Up</button>
        </a>
      </nav>

      <!-- Mobile hamburger -->
      <button class="md:hidden p-2 text-[#1A1A1A] cursor-pointer" (click)="toggleMenu()" aria-label="Toggle menu">
        <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>

    </div>

  </header>

  <!-- Mobile menu overlay + drawer (outside header so fixed positioning covers full viewport) -->
  @if (menuOpen()) {
    <!-- Backdrop -->
    <div class="mobile-overlay md:hidden" (click)="closeMenu()"></div>

    <!-- Drawer -->
    <div class="mobile-drawer md:hidden">
      <nav class="flex flex-col h-full">
        <div class="flex flex-col flex-1 px-6 pt-4">
          <a [routerLink]="['/events']" (click)="closeMenu()" class="mobile-nav-link">Events</a>
          <a [routerLink]="['/']" fragment="pricing" (click)="closeMenu()" class="mobile-nav-link">Pricing</a>
          <a [routerLink]="['/']" fragment="faq" (click)="closeMenu()" class="mobile-nav-link">FAQ</a>
          <a [routerLink]="['/auth/login']" (click)="closeMenu()" class="mobile-nav-link">Organizer Sign In</a>
        </div>
        <div class="px-6 py-6 border-t border-[#E0D5CC]">
          <a [routerLink]="['/auth/register']" (click)="closeMenu()">
            <button mat-flat-button class="nav-cta w-full">Organizer Sign Up</button>
          </a>
        </div>
      </nav>
    </div>
  }

  <!-- Page content -->
  <main>
    <router-outlet />
  </main>

</div>
