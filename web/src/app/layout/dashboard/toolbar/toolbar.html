<mat-toolbar
  class="toolbar !bg-surface border-b border-outline-variant !h-16 flex items-center justify-between px-4"
>
  <!-- Left: hamburger (mobile) or page title (desktop) -->
  <div class="flex items-center gap-2">
    @if (isMobile()) {
      <button mat-icon-button (click)="onToggleSidenav()" class="hamburger-btn">
        <mat-icon>menu</mat-icon>
      </button>
    } @else {
      <span class="page-title">{{ pageTitle() }}</span>
    }
  </div>

  <!-- Right: user badge + logout -->
  <div class="flex items-center gap-2">
    @if (user(); as u) {
      <!-- Pill badge: avatar + full name -->
      <div class="user-badge">
        <div class="user-avatar">{{ initials() }}</div>
        <span class="user-badge-name">{{ u.firstName }} {{ u.lastName }}</span>
      </div>

      <!-- Logout button -->
      <button
        mat-icon-button
        class="logout-btn"
        (click)="logout()"
        matTooltip="Sign out"
        matTooltipPosition="below"
      >
        <mat-icon class="logout-icon">logout</mat-icon>
      </button>
    } @else {
      <!-- Loading skeleton -->
      <div class="skeleton-badge">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-name"></div>
      </div>
    }
  </div>
</mat-toolbar>
