<mat-toolbar class="border-b border-gray-200 !h-16 flex items-center justify-between px-4">
  <div class="flex items-center gap-3">
    @if (isMobile()) {
      <button mat-icon-button (click)="onToggleSidenav()" class="hamburger-btn">
        <mat-icon class="hamburger-icon">menu</mat-icon>
      </button>
    }
  </div>

  <div class="flex items-center">
    <app-user-profile [user]="user()" />
  </div>
</mat-toolbar>
