<div class="flex flex-col h-full">
  <!-- Logo & Brand Section with Close Button -->
  <div class="h-16 px-4 border-b border-outline-variant flex items-center justify-between">
    <div class="flex items-center gap-1">
      <span class="font-display text-2xl leading-none text-foreground">oro</span>
      <span class="w-1.5 h-1.5 rounded-full bg-primary mb-0.5 flex-shrink-0"></span>
    </div>

    <!-- Close button - only visible on mobile -->
    @if (isMobile()) {
      <button
        mat-icon-button
        (click)="onCloseSidenav()"
        class="!ml-2"
        aria-label="Close menu"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 overflow-y-auto py-0">
    <mat-nav-list class="!p-0">
      @for (item of menuItem(); track item.label) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-route"
          [routerLinkActiveOptions]="{ exact: true }"
          class="!rounded-none transition-colors nav-item"
          (click)="isMobile() ? onCloseSidenav() : null"
        >
          <mat-icon matListItemIcon class="nav-icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </nav>
</div>
