<div class="max-w-lg mx-auto px-4 py-12">

  <!-- Hero -->
  <div class="text-center mb-10">
    <div class="hero-icon mx-auto mb-5">
      <mat-icon>support_agent</mat-icon>
    </div>
    <h1 class="text-2xl mb-3">How can we help?</h1>
    <div class="availability-badge">
      <span class="pulse-dot"></span>
      Mon – Sat &nbsp;·&nbsp; 7 AM – 8 PM
    </div>
  </div>

  <!-- Contact cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

    <a href="tel:+233000000000" class="contact-card">
      <div class="card-icon-wrap">
        <mat-icon>phone</mat-icon>
      </div>
      <p class="card-label">Call us</p>
      <p class="card-value">+233 00 000 0000</p>
      <p class="card-hint">Fastest way to reach us</p>
      <mat-icon class="card-arrow">arrow_forward</mat-icon>
    </a>

    <a href="mailto:support@oro.com" class="contact-card">
      <div class="card-icon-wrap">
        <mat-icon>mail_outline</mat-icon>
      </div>
      <p class="card-label">Email us</p>
      <p class="card-value">support&#64;oro.com</p>
      <p class="card-hint">We reply within 24 hours</p>
      <mat-icon class="card-arrow">arrow_forward</mat-icon>
    </a>

  </div>

  <!-- Off-hours note -->
  <p class="text-center text-sm text-surface-variant-foreground mt-8">
    Outside business hours? Send us an email and we'll get back to you first thing.
  </p>

</div>
