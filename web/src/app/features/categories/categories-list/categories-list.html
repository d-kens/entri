<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold" style="color: var(--mat-sys-on-surface)">Categories</h1>
      <p class="text-sm mt-1" style="color: var(--mat-sys-on-surface-variant)">
        Manage event categories
      </p>
    </div>
    <button mat-flat-button (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      New Category
    </button>
  </div>

  <app-data-table
    [loading]="loading()"
    [error]="error()"
    [empty]="categories().length === 0"
    emptyIcon="category"
    emptyTitle="No categories yet"
    emptyMessage="Create a category to organise events"
    (retry)="retry()"
  >
    <button emptyAction mat-stroked-button class="mt-4" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      New Category
    </button>

    <table mat-table [dataSource]="categories()" class="data-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let category">
          <span class="category-name">{{ category.name }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let category">
          <span class="category-description">{{ category.description }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let category" (click)="$event.stopPropagation()">
          <button
            mat-icon-button
            [matMenuTriggerFor]="actionMenu"
            [matMenuTriggerData]="{ category: category }"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </app-data-table>
</div>

<mat-menu #actionMenu="matMenu" class="row-action-menu">
  <ng-template matMenuContent let-category="category">
    <button mat-menu-item (click)="openEditDialog(category)">
      <mat-icon>edit</mat-icon>
      <span>Edit</span>
    </button>
    <button mat-menu-item class="delete-menu-item" (click)="confirmDelete(category)">
      <mat-icon>delete</mat-icon>
      <span>Delete</span>
    </button>
  </ng-template>
</mat-menu>
