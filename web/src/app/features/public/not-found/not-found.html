<div class="min-h-screen bg-[#FFF7F0] relative overflow-hidden flex flex-col items-center justify-center px-4 py-24">

  <!-- Dot pattern -->
  <div class="absolute inset-0 pointer-events-none"
    style="background-image: radial-gradient(#DDD0C6 1px, transparent 1px); background-size: 24px 24px; opacity: 0.4;">
  </div>

  <!-- Big faded 404 -->
  <p class="font-display font-black text-[#1A1A1A] leading-none select-none pointer-events-none"
    style="font-size: clamp(8rem, 30vw, 18rem); opacity: 0.04; margin-bottom: -2rem;">
    404
  </p>

  <!-- Content -->
  <div class="relative z-10 text-center max-w-md">
    <p class="text-[#E8572A] text-xs font-bold uppercase tracking-[0.15em] mb-4">Page not found</p>
    <h1 class="font-display text-3xl sm:text-4xl font-black text-[#1A1A1A] mb-3 leading-tight">
      This page doesn't exist
    </h1>
    <p class="text-[#6B6B6B] text-sm leading-relaxed mb-10">
      The link may be broken, or the page may have been removed.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a routerLink="/"
        class="inline-flex items-center gap-2 bg-[#1A1A1A] text-white font-bold text-sm px-6 py-3 rounded-full hover:bg-[#E8572A] transition-colors">
        <mat-icon class="!text-base">home</mat-icon>
        Back to home
      </a>
      <a routerLink="/discover"
        class="inline-flex items-center gap-2 text-[#1A1A1A] font-semibold text-sm px-6 py-3 rounded-full border border-[#D0C5BB] hover:border-[#1A1A1A] transition-colors">
        Browse events
      </a>
    </div>
  </div>

</div>
