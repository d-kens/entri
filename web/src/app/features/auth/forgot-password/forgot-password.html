<div class="w-full max-w-md mx-auto">
  <div class="bg-white rounded-2xl p-3 md:p-4">
    <div class="text-center mb-5">
      <h2 class="text-2xl mb-1 text-gray-900 font-bold">Reset Password</h2>
      <p class="text-sm text-gray-400">You will receive a link to this email address to reset</p>
    </div>

    <form [formGroup]="forgotPasswordForm" class="space-y-2 w-full">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email Address</mat-label>
        <input
          matInput
          type="email"
          placeholder="john@example.com"
          formControlName="email"
          autocomplete="email"
          data-cy="email-input"
        />
        <mat-icon matSuffix>mail_outline</mat-icon>
        @if (forgotPasswordForm.get('email')?.hasError('required')) {
          <mat-error>Email is required</mat-error>
        } @else if (forgotPasswordForm.get('email')?.hasError('email')) {
          <mat-error>Enter a valid email</mat-error>
        }
      </mat-form-field>

      <button
        appButton
        type="button"
        class="w-full"
        (click)="forgotPassword()"
        [loading]="isLoading()"
      >
        Send Reset Link
      </button>
    </form>
  </div>

  <p class="text-center text-sm mt-4">
    <a
      [routerLink]="['/auth/login']"
      class="inline-flex items-center gap-1 text-[#FF1867] font-semibold hover:underline"
    >
      <span>←</span><span>Back to sign in</span>
    </a>
  </p>
</div>
