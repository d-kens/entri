<div class="w-full max-w-md mx-auto">

  <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
    <div class="text-center mb-5">
      <h2 class="text-2xl mb-1 text-gray-900 font-bold">Reset Password</h2>
      <p class="text-sm text-gray-400">You will receive a link to this email address to reset</p>
    </div>

    <form [formGroup]="forgotPasswordForm" class="space-y-2 w-full">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" placeholder="john@example.com" formControlName="email" autocomplete="email" data-cy="email-input">
        <mat-icon matSuffix>mail_outline</mat-icon>
        @if (forgotPasswordForm.get('email')?.hasError('required')) {
          <mat-error>Email is required</mat-error>
        } @else if (forgotPasswordForm.get('email')?.hasError('email')) {
          <mat-error>Enter a valid email</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button class="w-full auth-brand-btn" type="button" (click)="forgotPassword()" [disabled]="isLoading()" data-cy="forgot-password-submit">
        @if (isLoading()) {
          <div class="flex items-center justify-center gap-2">
            <mat-progress-spinner diameter="16" mode="indeterminate"></mat-progress-spinner>
            <span>Sending reset link...</span>
          </div>
        } @else {
          <span>Send Reset Link</span>
        }
      </button>
    </form>
  </div>

  <p class="text-center text-sm mt-4 text-gray-500">
    <a [routerLink]="['/auth/login']" class="text-[#FF1867] font-semibold hover:underline">Back to sign in</a>
  </p>

</div>
