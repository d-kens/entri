<div class="w-full max-w-md mx-auto">
  <div class="text-center mb-6">
    <h2 class="text-2xl text-gray-900 font-semibold mb-2">Forgot Password</h2>
    <p class="text-sm text-gray-500">Enter your phone number to receive an OTP</p>
  </div>

  <form [formGroup]="form" class="space-y-2">
    <mat-form-field appearance="outline" class="w-full compact-field">
      <mat-label>Phone Number</mat-label>
      <input matInput type="tel" placeholder="e.g: 0707127309" formControlName="phoneNumber">
      <mat-icon matSuffix>phone</mat-icon>
      @if (form.get('phoneNumber')?.hasError('required')) {
        <mat-error>Phone number is required</mat-error>
      } @else {
        <mat-error>Enter a valid number (e.g. 0707127309)</mat-error>
      }
    </mat-form-field>

    <button mat-flat-button class="w-full h-11 !rounded-lg" type="button" (click)="submit()" [disabled]="isLoading()">
      @if (isLoading()) {
        <div class="flex items-center justify-center gap-2">
          <mat-progress-spinner diameter="18" mode="indeterminate"></mat-progress-spinner>
          <span>Sending OTP...</span>
        </div>
      } @else {
        <span>Send OTP</span>
      }
    </button>
  </form>

  <div class="text-center text-gray-500 mt-6">
    <p class="text-sm">
      Remember your password?
      <a [routerLink]="['/auth/login']" class="text-primary hover:underline cursor-pointer ml-1">Sign in</a>
    </p>
  </div>
</div>
