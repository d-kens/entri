<div class="auth-split">
  <!-- Left brand panel -->
  <div class="auth-brand-panel">
    <div class="brand-decor-circle brand-decor-circle--lg"></div>
    <div class="brand-decor-circle brand-decor-circle--sm"></div>

    <div class="brand-content">
      <div class="brand-logo">
        <span>entri</span>
        <span class="brand-dot"></span>
      </div>
      <p class="brand-tagline">Where events<br />come alive.</p>
      <p class="brand-sub">Sell tickets, fill seats, and track every entry - all in one place.</p>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="auth-form-panel">
    <a [routerLink]="['/']" class="brand-back-link"> <span>←</span> Back to home </a>
    <router-outlet />
  </div>
</div>
