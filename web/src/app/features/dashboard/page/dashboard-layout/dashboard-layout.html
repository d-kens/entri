<mat-sidenav-container class="h-screen">
  <mat-sidenav
    #sidenav
    [opened]="isOpen"
    [mode]="sidenavMode"
    [disableClose]="!isMobile()"
    [position]="'start'"
    class="!rounded-none !border-r !border-gray-200"
    [style.width]="'280px'"
  >
    <app-sidenav [isMobile]="isMobile()" (closeSidenav)="sidenav.close()" />
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <app-toolbar
      [isMobile]="isMobile()"
      [userName]="userName()"
      [walletBalance]="walletBalance()"
      [userRole]="userRole()"
      (toggleSidenav)="toggleSidenav()"
    />

    <div class="p-6">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
