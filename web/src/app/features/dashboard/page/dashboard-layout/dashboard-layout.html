<mat-sidenav-container class="h-screen">
  <mat-sidenav
    #sidenav
    [opened]="isOpen"
    [mode]="sidenavMode"
    [disableClose]="!isMobile()"
    [position]="'start'"
    class="!rounded-none !border-r !border-gray-200"
    [style.width]="'280px'"
  >
    <app-sidenav [isMobile]="isMobile()" (closeSidenav)="sidenav.close()" />
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="border-b border-gray-200 !h-16 flex items-center">
      @if (isMobile()) {
        <button mat-icon-button (click)="toggleSidenav()">
          <mat-icon>menu</mat-icon>
        </button>
      }
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
