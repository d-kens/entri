<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold" style="color: var(--mat-sys-on-surface)">Users</h1>
      <p class="text-sm mt-1" style="color: var(--mat-sys-on-surface-variant)">
        Manage user accounts
      </p>
    </div>
  </div>

  <app-data-table
    [loading]="loading()"
    [error]="error()"
    [empty]="users().length === 0"
    emptyIcon="people"
    emptyTitle="No users found"
    (retry)="retry()"
  >
    <mat-paginator
      tablePaginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)"
    />

    <table mat-table [dataSource]="users()" class="data-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">
          <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">
          <span class="user-email">{{ user.email }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">
          <span class="role-badge role-{{ user.role.toLowerCase() }}">{{ user.role }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let user">
          @if (user.enabled) {
            <span class="status-badge status-active">Active</span>
          } @else {
            <span class="status-badge status-disabled">Disabled</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user" (click)="$event.stopPropagation()">
          <button
            mat-icon-button
            [matMenuTriggerFor]="actionMenu"
            [matMenuTriggerData]="{ user: user }"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </app-data-table>
</div>

<mat-menu #actionMenu="matMenu" class="row-action-menu">
  <ng-template matMenuContent let-user="user">
    <button mat-menu-item (click)="toggleStatus(user)">
      <mat-icon>{{ user.enabled ? 'block' : 'check_circle' }}</mat-icon>
      <span>{{ user.enabled ? 'Disable' : 'Enable' }}</span>
    </button>
    <button mat-menu-item class="delete-menu-item" (click)="confirmDelete(user)">
      <mat-icon>delete</mat-icon>
      <span>Delete</span>
    </button>
  </ng-template>
</mat-menu>
