<div class="flex items-center justify-center min-h-[calc(100vh-64px-48px)] px-4">
  <div class="relative flex flex-col items-center gap-8 max-w-md w-full text-center">

    <!-- Background glow -->
    <div class="absolute inset-0 -z-10 flex items-center justify-center pointer-events-none">
      <div class="w-72 h-72 rounded-full bg-error/8 blur-3xl"></div>
    </div>

    <!-- Icon badge -->
    <div class="flex items-center justify-center w-20 h-20 rounded-2xl bg-error-container shadow-sm">
      <mat-icon class="text-error" style="font-size: 36px; width: 36px; height: 36px;">lock</mat-icon>
    </div>

    <!-- Text content -->
    <div class="flex flex-col items-center gap-3">
      <h1 class="font-display text-4xl font-normal text-on-surface leading-tight">
        Access Denied
      </h1>
      <p class="text-base text-on-surface-variant leading-relaxed">
        You don't have the required permissions to view this page.
        Contact your administrator if you believe this is a mistake.
      </p>
    </div>

    <!-- Divider -->
    <div class="w-full h-px bg-outline-variant"></div>

    <!-- Actions -->
    <button mat-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Go Back
    </button>

  </div>
</div>
