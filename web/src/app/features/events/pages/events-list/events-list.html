<div class="flex flex-col gap-6">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold" style="color: var(--mat-sys-on-surface)">Events</h1>
      <p class="text-sm mt-1" style="color: var(--mat-sys-on-surface-variant)">Manage your events</p>
    </div>
    <a mat-flat-button [routerLink]="['/dashboard/events/create']">
      <mat-icon>add</mat-icon>
      Create Event
    </a>
  </div>

  <div class="empty-state">
    <mat-icon class="empty-icon">confirmation_number</mat-icon>
    <p class="empty-title">No events yet</p>
    <p class="empty-sub">Create your first event to get started</p>
    <a mat-stroked-button [routerLink]="['/dashboard/events/create']" class="mt-4">
      <mat-icon>add</mat-icon>
      Create Event
    </a>
  </div>

</div>
