<div class="create-page">
  <header class="create-header">
    <a mat-stroked-button [routerLink]="['/dashboard/events']" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
      Events
    </a>
    <div class="create-header-divider"></div>
    <div>
      <h1 class="create-title">Create Event</h1>
      <p class="create-subtitle">Fill in the details below to create your event</p>
    </div>
  </header>

  <app-event-basic-details-form
    [eventCategories]="categories()"
    [loading]="loading()"
    formSubmitButtonLabel="Create Event"
    (submitted)="onSubmitted($event)"
  ></app-event-basic-details-form>
</div>
