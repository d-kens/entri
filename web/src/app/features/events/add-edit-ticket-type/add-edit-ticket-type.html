<div class="add-edit-ticket-types-page">
  @if (isLoading()) {
    <div class="page-loading">
      <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
    </div>
  }

  @if (!isLoading() && event(); as ev) {
    <app-event-hero [event]="ev" [backLink]="['/dashboard/events', ev.externalId]" />

    <!-- Page header -->
    <div class="page-header">
      <div class="page-header-text">
        <h2 class="page-header-title">Ticket Types</h2>
        <p class="page-header-sub">Define and manage the ticket types available for this event.</p>
      </div>
    </div>
  }
</div>
