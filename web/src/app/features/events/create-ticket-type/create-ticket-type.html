<div class="create-ticket-type-page">
  @if (!isLoadingEvent() && event(); as ev) {
    <app-event-hero [event]="ev" [backLink]="['/dashboard/events', ev.externalId]" />

    <div class="page-header">
      <div class="page-header-text">
        <h2 class="page-header-title">Ticket Types</h2>
        <p class="page-header-sub">Define and manage the ticket types available for this event.</p>
      </div>
    </div>

    <app-tickek-type-form
      [submitLabel]="'Save Ticket Type'"
      [isLoading]="isSaving()"
      (added)="onSaved($event)"
    />
  }
</div>
