<div class="bg-white rounded-xl shadow-sm p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-base font-semibold text-gray-700">{{ title }}</h2>
    <mat-button-toggle-group
      [(ngModel)]="selectedPeriod"
      (change)="onPeriodChange()"
      class="text-sm"
    >
      <mat-button-toggle value="7d">7d</mat-button-toggle>
      <mat-button-toggle value="30d">30d</mat-button-toggle>
      <mat-button-toggle value="12m">12m</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  @if (loading()) {
    <div class="h-56 bg-gray-100 animate-pulse rounded-lg"></div>
  } @else if (error()) {
    <p class="text-red-500 text-sm">Failed to load trend data.</p>
  } @else {
    <div class="h-56">
      <canvas #chartCanvas></canvas>
    </div>
  }
</div>
