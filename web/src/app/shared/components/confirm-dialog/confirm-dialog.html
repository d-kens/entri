<div class="dialog-container">
  <div class="icon-wrap">
    <mat-icon class="icon">{{ data.icon ?? 'delete_forever' }}</mat-icon>
  </div>

  <div class="dialog-body">
    <h2 class="dialog-title">{{ data.title ?? 'Are you sure?' }}</h2>
    <p class="dialog-message">{{ data.message }}</p>
  </div>

  <div class="dialog-actions">
    <button appButton variant="outline" (click)="cancel()">Cancel</button>
    <button appButton variant="danger" (click)="confirm()">
      {{ data.confirmLabel ?? 'Delete' }}
    </button>
  </div>
</div>
