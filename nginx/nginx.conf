# VM-level reverse proxy — main entry point for all traffic.
# Terminates TLS and routes to the other containers in the same compose
# project, over the default Docker network (reachable by service name).

events {
    worker_connections 1024;
}

http {
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS redirect: www → non-www ────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name www.oro.co.ke;

        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        return 301 https://oro.co.ke$request_uri;
    }

    # ── HTTPS — main server ───────────────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name oro.co.ke;

        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── /api  →  Spring Boot container ───────────────────────────────────
        location /api/ {
            set $upstream_api http://api:8080;
            proxy_pass $upstream_api;

            client_max_body_size 10m;
        }

        # ── /  →  Angular + Nginx container ──────────────────────────────────
        location / {
            set $upstream_web http://web:80;
            proxy_pass $upstream_web;
        }
    }
}
