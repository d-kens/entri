# EC2-level reverse proxy — main entry point for all traffic
# Terminates SSL and routes to containerised services on localhost

events {
    worker_connections 1024;
}

http {
    # ── Shared proxy defaults ─────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — main server ───────────────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name oro.co.ke;

        # TLS — Let's Encrypt (certbot) paths
        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── /api  →  Spring Boot container ───────────────────────────────────
        location /api/ {
            proxy_pass http://api:8080/api/;

            # Allow larger JSON/multipart payloads (file uploads)
            client_max_body_size 10m;
        }

        # ── /  →  Angular + Nginx container ──────────────────────────────────
        location / {
            proxy_pass http://web:80/;
        }
    }
}
