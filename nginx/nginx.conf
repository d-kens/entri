# VM-level reverse proxy — main entry point for all traffic.
# Terminates TLS and routes to the other containers in the same compose
# project, over the default Docker network (reachable by service name).

events {
    worker_connections 1024;
}

http {
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Grafana's live dashboard updates use websockets — Upgrade only carries a
    # value on those requests, so Connection must follow it instead of the
    # static "" this http block sets for every other proxied request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting: per-IP, enforced here regardless of how many api replicas exist ──
    # Both zones key on POST only (the method that actually creates state); other
    # methods resolve to an empty string, and limit_req_zone never counts empty keys.
    # This matters today, not just hypothetically: GET /api/events/{id}/reservations
    # (the same URL, used by organizers to list an event's reservations) already
    # matches the reservations location below and would otherwise share its limit
    # with the anonymous POST that creates one. The password-reset location has no
    # such GET route today, but is keyed the same way for consistency.
    map $request_method $password_reset_limit_key {
        default "";
        POST    $binary_remote_addr;
    }
    map $request_method $reservation_limit_key {
        default "";
        POST    $binary_remote_addr;
    }

    # These are a coarse, best-effort brake on single-IP scripting, not a full defense:
    # shared IPs (CGNAT, mobile carriers) can legitimately burst during an on-sale rush,
    # and a distributed proxy pool bypasses per-IP limits entirely. Password-reset abuse
    # has a second, per-account backstop in PasswordResetService (one outstanding reset
    # link per user) that a proxy pool can't get around. Reservation abuse is additionally
    # bounded by each ticket type's maxTicketsPerOrder and the reservation-expiration job
    # releasing unpaid holds — the burst below is sized to tolerate a shared-IP crowd
    # during a launch, not to fully stop a determined attacker on its own.
    limit_req_zone $password_reset_limit_key zone=password_reset:10m      rate=5r/m;
    limit_req_zone $reservation_limit_key    zone=ticket_reservations:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS redirect: www → non-www ────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name www.oro.co.ke;

        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        return 301 https://oro.co.ke$request_uri;
    }

    # ── HTTPS — main server ───────────────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name oro.co.ke;

        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # Rate-limit rejections return a ProblemDetail-shaped body (matching
        # GlobalExceptionHandler's contract) instead of nginx's default HTML error
        # page, so the frontend's existing application/problem+json handling works.
        # NOTE: once a location sets any add_header, it stops inheriting the
        # server block's add_header directives (nginx only inherits add_header
        # when the current level defines none) — so the security headers above
        # are re-declared here rather than silently dropped on 429 responses.
        location @rate_limited {
            default_type application/problem+json;
            add_header Retry-After                "60"                                   always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options           "SAMEORIGIN"                          always;
            add_header X-Content-Type-Options    "nosniff"                             always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests — please wait a moment and try again."}';
        }

        # ── /api/auth/forgot-password & reset-password — throttle to stop email/SMS bombing ──
        # /api/auth/login and /api/auth/register are equally attractive brute-force
        # targets but are intentionally left unthrottled for now — out of scope for
        # this pass; revisit if abuse is observed (TODO).
        location ~ ^/api/auth/(forgot|reset)-password$ {
            limit_req zone=password_reset burst=3 nodelay;
            error_page 429 = @rate_limited;

            include snippets/proxy-api.conf;
            client_max_body_size 8k;
        }

        # ── /api/events/*/reservations — throttle to stop inventory-hoarding bots ──
        location ~ ^/api/events/[^/]+/reservations$ {
            limit_req zone=ticket_reservations burst=10 nodelay;
            error_page 429 = @rate_limited;

            include snippets/proxy-api.conf;
            client_max_body_size 8k;
        }

        # ── /api/actuator/*  →  block everything except health/info from the public internet ──
        # /actuator/prometheus is permitAll in Spring Security so the prometheus
        # container (which scrapes api:8080 directly over the compose network,
        # never through nginx) can reach it with no JWT. Without this block,
        # the same permitAll would leave it — and any other exposed actuator
        # endpoint — reachable at https://oro.co.ke/api/actuator/* by anyone.
        location ~ ^/api/actuator/(?!health$|info$) {
            return 404;
        }

        # ── /api  →  Spring Boot container ───────────────────────────────────
        location /api/ {
            include snippets/proxy-api.conf;
            client_max_body_size 10m;
        }

        # ── /grafana  →  Grafana container (auth: Grafana's own login) ──────────
        # Sets its own proxy_set_header list for the websocket upgrade, which
        # discards the whole set inherited from the http block (nginx doesn't
        # merge proxy_set_header per-directive) — so Host/X-Real-IP/etc. are
        # repeated here rather than silently dropped.
        #
        # Resolved through a variable, not a literal proxy_pass — a literal
        # host resolves once at config-load time, which fails validation
        # under `docker compose run --no-deps` (grafana isn't running) and
        # would also fail nginx's own startup/reload if grafana is ever down.
        # A variable defers the lookup to request time via the resolver above.
        location /grafana/ {
            set $upstream_grafana http://grafana:3000;
            proxy_pass $upstream_grafana;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Upgrade           $http_upgrade;
            proxy_set_header    Connection        $connection_upgrade;
        }

        # ── /  →  Angular + Nginx container ──────────────────────────────────
        location / {
            set $upstream_web http://web:80;
            proxy_pass $upstream_web;
        }
    }
}
