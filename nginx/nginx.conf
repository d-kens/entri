# VM-level reverse proxy — main entry point for all traffic.
# Terminates TLS and routes to the other containers in the same compose
# project, over the default Docker network (reachable by service name).

events {
    worker_connections 1024;
}

http {
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate limiting: per-IP, enforced here regardless of how many api replicas exist ──
    # Both zones key on POST only (the method that actually creates state); other
    # methods resolve to an empty string, and limit_req_zone never counts empty keys.
    # (Currently both matched locations are POST-only anyway — this just keeps the
    # two zones consistent and safe if a GET route is ever added under either path.)
    map $request_method $password_reset_limit_key {
        default "";
        POST    $binary_remote_addr;
    }
    map $request_method $reservation_limit_key {
        default "";
        POST    $binary_remote_addr;
    }

    # These are a coarse, best-effort brake on single-IP scripting, not a full defense:
    # shared IPs (CGNAT, mobile carriers) can legitimately burst during an on-sale rush,
    # and a distributed proxy pool bypasses per-IP limits entirely. Password-reset abuse
    # has a second, per-account backstop in PasswordResetService (one outstanding reset
    # link per user) that a proxy pool can't get around. Reservation abuse is additionally
    # bounded by each ticket type's maxTicketsPerOrder and the reservation-expiration job
    # releasing unpaid holds — the burst below is sized to tolerate a shared-IP crowd
    # during a launch, not to fully stop a determined attacker on its own.
    limit_req_zone $password_reset_limit_key zone=password_reset:10m      rate=5r/m;
    limit_req_zone $reservation_limit_key    zone=ticket_reservations:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS redirect: www → non-www ────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name www.oro.co.ke;

        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        return 301 https://oro.co.ke$request_uri;
    }

    # ── HTTPS — main server ───────────────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name oro.co.ke;

        ssl_certificate     /etc/letsencrypt/live/oro.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oro.co.ke/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # Rate-limit rejections return a ProblemDetail-shaped body (matching
        # GlobalExceptionHandler's contract) instead of nginx's default HTML error
        # page, so the frontend's existing application/problem+json handling works.
        location @rate_limited {
            default_type application/problem+json;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests — please wait a moment and try again."}';
        }

        # ── /api/auth/forgot-password & reset-password — throttle to stop email/SMS bombing ──
        location ~ ^/api/auth/(forgot|reset)-password$ {
            limit_req zone=password_reset burst=3 nodelay;
            error_page 429 = @rate_limited;

            include snippets/proxy-api.conf;
            client_max_body_size 8k;
        }

        # ── /api/events/*/reservations — throttle to stop inventory-hoarding bots ──
        location ~ ^/api/events/[^/]+/reservations$ {
            limit_req zone=ticket_reservations burst=10 nodelay;
            error_page 429 = @rate_limited;

            include snippets/proxy-api.conf;
            client_max_body_size 8k;
        }

        # ── /api  →  Spring Boot container ───────────────────────────────────
        location /api/ {
            include snippets/proxy-api.conf;
            client_max_body_size 10m;
        }

        # ── /  →  Angular + Nginx container ──────────────────────────────────
        location / {
            set $upstream_web http://web:80;
            proxy_pass $upstream_web;
        }
    }
}
