spring:
  application:
    name: puuul

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: ${JWT_SECRET}
  accessTokenExpiration: 900
  refreshTokenExpiration: 604800

novu:
  api:
    key: ${NOVU_SECRET:secret}
  subscriber:
    locale: ${NOVU_SUBSCRIBER_LOCALE:en-KE}
    timezone: ${NOVU_SUBSCRIBER_TIMEZONE:Africa/Nairobi}