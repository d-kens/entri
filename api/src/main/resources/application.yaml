spring:
  application:
    name: entri
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  liquibase:
    change-log: classpath:db/changelog/changelog.xml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  accessTokenExpiration: 900
  refreshTokenExpiration: 604800

app:
  base-url: ${APP_BASE_URL}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN}
  password-reset:
    expiry-minutes: 15

cookie:
  secure: true

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:oro-web-app-firebase-adminsdk-fbsvc-8f2ea245fd.json}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:oro-web-app.firebasestorage.app}

novu:
  api:
    key: ${NOVU_SECRET}
  subscriber:
    locale: ${NOVU_SUBSCRIBER_LOCALE:en-KE}
    timezone: ${NOVU_SUBSCRIBER_TIMEZONE:Africa/Nairobi}

intasend:
  base-url: https://api.intasend.com
  payment-base-url: https://payment.intasend.com
  publishable-key: ${INTASEND_PUBLISHABLE_KEY}
  secret-key: ${INTASEND_SECRET_KEY}
  webhook-challenge: ${INTASEND_WEBHOOK_CHALLENGE}

platform:
  service-fee-rate: ${PLATFORM_SERVICE_FEE_RATE:0.05}

rate-limit:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  reservation:
    capacity: 5
    refill-period-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  info:
    build:
      enabled: true
    env:
      enabled: true