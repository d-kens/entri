spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:oro-db-user}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    com.oro.api: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

jwt:
  secret: ${JWT_SECRET:secret}
  access-token-expiration: 120
  refresh-token-expiration: 300

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:oro-web-app-firebase-adminsdk-fbsvc-8f2ea245fd.json}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:oro-web-app.firebasestorage.app}

cookie:
  secure: false
server:
  port: 9096