name: CI Web

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
    tags:
      - "web-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Release
        working-directory: ./web
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/web-v')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/316572518098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@entri-prod.iam.gserviceaccount.com

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: africa-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            africa-south1-docker.pkg.dev/entri-prod/entri/web:latest
            africa-south1-docker.pkg.dev/entri-prod/entri/web:${{ github.sha }}
            africa-south1-docker.pkg.dev/entri-prod/entri/web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
