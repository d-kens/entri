name: CI Web

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-and-publish:
    name: Release & publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # ci-api.yml's release-and-publish job shares this group so the two
    # never push release commits to master at the same time - whichever
    # starts first runs to completion before the other's release step begins.
    concurrency:
      group: release-master
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      # ci-api.yml can run concurrently on the same push (e.g. a merge that
      # touches both api/** and web/**) and pushes its own release commit to
      # master. Re-sync right before releasing so semantic-release doesn't
      # fail against a checkout that went stale mid-run.
      - name: Sync with latest master
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Release
        working-directory: ./web
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning as ci-api.yml: a tag pushed by semantic-release using
      # GITHUB_TOKEN never triggers a new workflow run, so build/push happens
      # right here instead of depending on a separate `on: push: tags` job.
      - name: Determine released version
        id: version
        working-directory: ./web
        run: echo "tag=web-v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/316572518098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@entri-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: africa-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            africa-south1-docker.pkg.dev/entri-prod/entri/web:latest
            africa-south1-docker.pkg.dev/entri-prod/entri/web:${{ github.sha }}
            africa-south1-docker.pkg.dev/entri-prod/entri/web:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
