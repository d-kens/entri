name: Mobile

on:
  push:
    branches:
      - master
    paths:
      - "mobile/**"
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release — semver (e.g. 1.2.0) or increment (patch, minor, major). Defaults to patch.
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build
        working-directory: ./mobile
        run: npx ng build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip release]')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        working-directory: ./mobile
        run: |
          npm version "${VERSION_INPUT:-patch}" --tag-version-prefix=mobile-v -m "chore(release): %s [skip release]"
          git push --follow-tags
        env:
          VERSION_INPUT: ${{ inputs.release_version }}
