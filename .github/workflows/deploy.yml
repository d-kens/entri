name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        options:
          - api
          - web
        required: true
      tag:
        description: Image tag to deploy (e.g. api-v1.2.3 or web-v2.0.0)
        type: string
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/316572518098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@entri-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/entri_ci
          echo "${{ secrets.ENTRI_CI_SSH_PRIVATE_KEY }}" > ~/.ssh/entri_ci

      - name: Start IAP tunnel
        run: |
          gcloud compute start-iap-tunnel entri-vm 22 \
            --local-host-port=localhost:2222 \
            --zone=africa-south1-a \
            --project=entri-prod &
          sleep 5

      - name: Sync compose/nginx/deploy files
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -P 2222 \
            docker-compose.yml deploy.sh ubuntu@localhost:~/entri/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -P 2222 \
            nginx/nginx.conf ubuntu@localhost:~/entri/nginx/nginx.conf
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -p 2222 ubuntu@localhost \
            "chmod +x ~/entri/deploy.sh"

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -p 2222 ubuntu@localhost \
            "cd ~/entri && ./deploy.sh ${{ inputs.service }} ${{ inputs.tag }}"
