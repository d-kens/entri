name: API

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
    tags:
      - "api-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release (leave blank to auto-increment patch)
        type: string
      new_version:
        description: Next version after release (leave blank to auto-increment)
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Run tests
        working-directory: ./api
        run: ./gradlew test --no-daemon

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[Gradle Release Plugin]')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        working-directory: ./api
        run: ./gradlew release -Prelease.releaseVersion="$RELEASE_VERSION" -Prelease.newVersion="$NEW_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEW_VERSION: ${{ inputs.new_version }}

  publish:
    name: Build & push
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/api-v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/d-kens/entri-api:latest
            ghcr.io/d-kens/entri-api:${{ github.sha }}
            ghcr.io/d-kens/entri-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
