name: API

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
    tags:
      - "api-v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Run tests
        working-directory: ./api
        run: ./gradlew test --no-daemon

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install semantic-release plugins
        working-directory: ./api
        run: npm install --no-save @semantic-release/exec @semantic-release/git

      - name: Release
        working-directory: ./api
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build & push
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/api-v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/d-kens/entri-api:latest
            ghcr.io/d-kens/entri-api:${{ github.sha }}
            ghcr.io/d-kens/entri-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
