name: CI API

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release (leave blank to auto-increment patch)
        type: string
      new_version:
        description: Next version after release (leave blank to auto-increment)
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-and-publish:
    name: Release & publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[Gradle Release Plugin]')
    permissions:
      contents: write
      id-token: write
    # ci-web.yml's release-and-publish job shares this group so the two
    # never push release commits to master at the same time - whichever
    # starts first runs to completion before the other's release step begins.
    concurrency:
      group: release-master
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ci-web.yml can run concurrently on the same push (e.g. a merge that
      # touches both api/** and web/**) and pushes its own release commit to
      # master. Re-sync right before releasing so this job doesn't fail
      # checkUpdateNeeded against a checkout that went stale mid-run.
      - name: Sync with latest master
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Release
        working-directory: ./api
        run: ./gradlew release -Prelease.releaseVersion="$RELEASE_VERSION" -Prelease.newVersion="$NEW_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEW_VERSION: ${{ inputs.new_version }}

      # The release step above just created and pushed a new tag locally in
      # this same job — a separate workflow triggered by `on: push: tags`
      # would never actually fire, since GITHUB_TOKEN-authenticated pushes
      # don't trigger new workflow runs. So the build/push happens right here
      # instead of depending on that second trigger.
      - name: Determine released version
        id: version
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'api-v*')" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/316572518098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@entri-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: africa-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            africa-south1-docker.pkg.dev/entri-prod/entri/api:latest
            africa-south1-docker.pkg.dev/entri-prod/entri/api:${{ github.sha }}
            africa-south1-docker.pkg.dev/entri-prod/entri/api:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
