name: CI API

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
    tags:
      - "api-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release (leave blank to auto-increment patch)
        type: string
      new_version:
        description: Next version after release (leave blank to auto-increment)
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[Gradle Release Plugin]')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        working-directory: ./api
        run: ./gradlew release -Prelease.releaseVersion="$RELEASE_VERSION" -Prelease.newVersion="$NEW_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEW_VERSION: ${{ inputs.new_version }}

  publish:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/api-v')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/316572518098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@entri-prod.iam.gserviceaccount.com

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: africa-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            africa-south1-docker.pkg.dev/entri-prod/entri/api:latest
            africa-south1-docker.pkg.dev/entri-prod/entri/api:${{ github.sha }}
            africa-south1-docker.pkg.dev/entri-prod/entri/api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
