name: Publish Docker Images

on:
  push:
    branches:
      - master

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Run tests
        working-directory: ./api
        run: ./gradlew test --no-daemon

  test-web:
    name: Test Web (e2e)
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0.32
        env:
          MYSQL_DATABASE: oro
          MYSQL_USER: oro-ci
          MYSQL_PASSWORD: ci-secret
          MYSQL_ROOT_PASSWORD: ci-root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-root-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase.json

      - name: Build API
        working-directory: ./api
        run: ./gradlew bootJar --no-daemon

      - name: Start API in background
        working-directory: ./api
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_USERNAME: oro-ci
          SPRING_DATASOURCE_PASSWORD: ci-secret
          JWT_SECRET: ci-jwt-secret-for-testing-only
          APP_BASE_URL: http://localhost:9096
          APP_CORS_ALLOWED_ORIGIN: http://localhost:4200
          FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/firebase.json
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NOVU_SECRET: dummy
        run: java -jar build/libs/api-1.0.0.jar &

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./web
          start: npm start
          wait-on: 'http://localhost:4200, http://localhost:9096/actuator/health'
          wait-on-timeout: 180
          command: npm run cy:run
        env:
          CYPRESS_API_BASE_URL: http://localhost:9096/api
          CYPRESS_TEST_REGISTER_FIRST_NAME: Test
          CYPRESS_TEST_REGISTER_LAST_NAME: User
          CYPRESS_TEST_REGISTER_PHONE: "0712345678"
          CYPRESS_TEST_REGISTER_PASSWORD: TestPassword123!

  publish-api:
    name: Build & push API
    runs-on: ubuntu-latest
    needs: test-api
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/d-kens/oro-api:latest
            ghcr.io/d-kens/oro-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-web:
    name: Build & push Web
    runs-on: ubuntu-latest
    needs: test-web
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/d-kens/oro-web:latest
            ghcr.io/d-kens/oro-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
