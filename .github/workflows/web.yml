name: Web

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
    tags:
      - "web-v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Check formatting
        working-directory: ./web
        run: npx prettier --check .

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install semantic-release plugins
        working-directory: ./web
        run: npm install --no-save @semantic-release/npm @semantic-release/git

      - name: Release
        working-directory: ./web
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build & push
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/web-v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/d-kens/entri-web:latest
            ghcr.io/d-kens/entri-web:${{ github.sha }}
            ghcr.io/d-kens/entri-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
