name: CI Nginx

on:
  push:
    branches:
      - master
    paths:
      - "nginx/**"
  pull_request:
    paths:
      - "nginx/**"

jobs:
  validate:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dummy TLS cert
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/certs/privkey.pem \
            -out /tmp/certs/fullchain.pem -days 1 -nodes -subj "/CN=oro.co.ke"

      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "/tmp/certs:/etc/letsencrypt/live/oro.co.ke:ro" \
            nginx:1.27.4-alpine nginx -t
