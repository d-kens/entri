name: Deploy Monitoring

on:
  push:
    branches:
      - master
    paths:
      - "monitoring/**"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/316572518098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@entri-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/entri_ci
          echo "${{ secrets.ENTRI_CI_SSH_PRIVATE_KEY }}" > ~/.ssh/entri_ci

      - name: Start IAP tunnel
        run: |
          gcloud compute start-iap-tunnel entri-vm 22 \
            --local-host-port=localhost:2222 \
            --zone=africa-south1-a \
            --project=entri-prod &
          sleep 5

      - name: Sync monitoring files
        run: |
          # docker-compose.yml is synced here too, not just from deploy.yml —
          # prometheus/grafana's own service definitions (image tags, volume
          # mounts) can change alongside monitoring/** and need to land
          # together, not wait for the next unrelated api/web deploy.
          scp -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -P 2222 \
            docker-compose.yml deploy-monitoring.sh ubuntu@localhost:~/entri/
          # "monitoring/." (not "monitoring") — copies the directory's
          # contents rather than the directory itself, avoiding nesting.
          # mkdir -p first since this directory doesn't already exist on the
          # VM from any prior manual setup.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -p 2222 ubuntu@localhost \
            "mkdir -p ~/entri/monitoring"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -P 2222 -r \
            monitoring/. ubuntu@localhost:~/entri/monitoring/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -p 2222 ubuntu@localhost \
            "chmod +x ~/entri/deploy-monitoring.sh"

      - name: Deploy monitoring config
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/entri_ci -p 2222 ubuntu@localhost \
            "cd ~/entri && ./deploy-monitoring.sh"
